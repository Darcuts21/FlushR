<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlushR — Trouvez les meilleures toilettes</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#F7F4EF; --surface:#fff; --surface2:#F0EDE8;
  --accent:#2D6A4F; --accent2:#52B788; --accent-light:#D8F3DC;
  --danger:#C1121F; --danger-light:#FDECEA;
  --warn:#E76F51; --warn-light:#FEF0EB;
  --text:#1A1A1A; --text2:#5C5C5C; --text3:#9A9A9A;
  --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.14);
  --radius:14px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Syne',sans-serif}
.hidden{display:none!important}

/* LOADING */
#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:50}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent);letter-spacing:-.5px}
.logo span{color:var(--text3);font-weight:400;font-size:13px;margin-left:6px;vertical-align:middle}

/* AUTH & PAGES */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:var(--surface);border-radius:20px;border:1px solid var(--border);padding:40px;max-width:420px;width:100%}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:500;margin-bottom:6px}
.form-input{width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);font-size:14px;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--accent);color:white}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}

/* FEED */
.page{max-width:900px;margin:0 auto;padding:32px 24px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
.toilet-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:15px;cursor:pointer}
.card-img{height:140px;background:var(--surface2);display:flex;align-items:center;justify-content:center;border-radius:8px;margin-bottom:10px;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:20px;width:90%;max-width:500px;padding:30px;position:relative}
.star-pick{font-size:24px;cursor:pointer;color:#D3D1C7}.star-pick.lit{color:#EF9F27}
</style>
</head>
<body>

<div id="loading-screen"><div class="spinner"></div><p>Initialisation FlushR...</p></div>

<nav id="main-nav" class="hidden">
  <div class="logo">FlushR <span>by Lucien</span></div>
  <div class="nav-right">
    <button class="btn btn-outline" onclick="window.doLogout()">Déconnexion</button>
  </div>
</nav>

<!-- LOGIN -->
<div id="page-login" class="auth-wrap hidden">
  <div class="auth-card">
    <h2 style="text-align:center;margin-bottom:20px">Connexion</h2>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="login-email" type="email"></div>
    <div class="form-group"><label class="form-label">Mot de passe</label><input class="form-input" id="login-pwd" type="password"></div>
    <button class="btn btn-primary" style="width:100%" onclick="window.doLogin()">Se connecter</button>
    <p style="margin-top:15px;text-align:center;font-size:13px">Pas de compte ? <a href="#" onclick="showPage('register')">S'inscrire</a></p>
  </div>
</div>

<!-- REGISTER -->
<div id="page-register" class="auth-wrap hidden">
  <div class="auth-card">
    <h2 style="text-align:center;margin-bottom:20px">Inscription</h2>
    <div class="form-group"><label class="form-label">Pseudo</label><input class="form-input" id="reg-name" type="text"></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="reg-email" type="email"></div>
    <div class="form-group"><label class="form-label">Mot de passe</label><input class="form-input" id="reg-pwd" type="password"></div>
    <button class="btn btn-primary" style="width:100%" onclick="window.doRegister()">Créer le compte</button>
    <p style="margin-top:15px;text-align:center;font-size:13px"><a href="#" onclick="showPage('login')">Retour connexion</a></p>
  </div>
</div>

<!-- FEED -->
<div id="page-feed" class="hidden">
  <div class="page">
    <div style="display:flex;justify-content:space-between;align-items:center">
        <h1>Toilettes</h1>
        <button class="btn btn-primary" onclick="document.getElementById('modal-add').classList.add('open')">+ Ajouter</button>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>
</div>

<!-- MODAL ADD -->
<div class="modal-bg" id="modal-add">
  <div class="modal">
    <h3>Ajouter un lieu</h3>
    <div class="form-group"><label class="form-label">Nom</label><input class="form-input" id="add-name" type="text"></div>
    <div class="form-group"><label class="form-label">Adresse</label><input class="form-input" id="add-address" type="text"></div>
    <div class="form-group">
        <label class="form-label">Note</label>
        <div id="star-container">
            <span class="star-pick" onclick="window.setStar(1)">★</span><span class="star-pick" onclick="window.setStar(2)">★</span><span class="star-pick" onclick="window.setStar(3)">★</span><span class="star-pick" onclick="window.setStar(4)">★</span><span class="star-pick" onclick="window.setStar(5)">★</span>
        </div>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="window.submitToilet()">Publier</button>
    <button class="btn btn-outline" style="width:100%;margin-top:10px" onclick="document.getElementById('modal-add').classList.remove('open')">Fermer</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2Z_crCC6Hfn3haaPqd8UErXxzTcEXKZY",
    authDomain: "flushr-ca973.firebaseapp.com",
    projectId: "flushr-ca973",
    storageBucket: "flushr-ca973.firebasestorage.app",
    messagingSenderId: "637232955486",
    appId: "1:637232955486:web:9eba4e51f1e2d6d89874cf",
    measurementId: "G-8JD8LF24ZP"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentStars = 0;

  // EXPOSITION DES FONCTIONS AU WINDOW (pour les onclick du HTML)
  window.showPage = (name) => {
    document.getElementById('page-login').classList.add('hidden');
    document.getElementById('page-register').classList.add('hidden');
    document.getElementById('page-feed').classList.add('hidden');
    document.getElementById('main-nav').classList.add('hidden');

    document.getElementById('page-' + name).classList.remove('hidden');
    if (name === 'feed') {
        document.getElementById('main-nav').classList.remove('hidden');
        renderFeed();
    }
  };

  window.doRegister = async () => {
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const pwd = document.getElementById('reg-pwd').value;
    try {
        const res = await createUserWithEmailAndPassword(auth, email, pwd);
        await updateProfile(res.user, { displayName: name });
        alert("Compte créé !");
    } catch (e) { alert(e.message); }
  };

  window.doLogin = async () => {
    const email = document.getElementById('login-email').value;
    const pwd = document.getElementById('login-pwd').value;
    try { await signInWithEmailAndPassword(auth, email, pwd); } 
    catch (e) { alert("Erreur connexion"); }
  };

  window.doLogout = () => signOut(auth);

  window.setStar = (n) => {
    currentStars = n;
    document.querySelectorAll('.star-pick').forEach((s, i) => s.classList.toggle('lit', i < n));
  };

  window.submitToilet = async () => {
    const name = document.getElementById('add-name').value;
    const addr = document.getElementById('add-address').value;
    if(!name || !addr) return alert("Remplis tout !");

    try {
        await addDoc(collection(db, "toilets"), {
            name, address: addr, stars: currentStars,
            createdBy: auth.currentUser.displayName,
            createdAt: new Date()
        });
        document.getElementById('modal-add').classList.remove('open');
        renderFeed();
    } catch (e) { alert("Erreur d'envoi"); }
  };

  async function renderFeed() {
    const grid = document.getElementById('cards-grid');
    grid.innerHTML = "Chargement...";
    const q = query(collection(db, "toilets"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    grid.innerHTML = "";
    snap.forEach(doc => {
        const t = doc.data();
        const card = document.createElement('div');
        card.className = 'toilet-card';
        card.innerHTML = `
            <div class="card-img">🚽</div>
            <h3>${t.name}</h3>
            <p style="font-size:12px; color:gray">${t.address}</p>
            <div style="color:#EF9F27">${"★".repeat(t.stars)}${"☆".repeat(5-t.stars)}</div>
            <p style="font-size:10px; margin-top:5px">Par ${t.createdBy}</p>
        `;
        grid.appendChild(card);
    });
  }

  // SURVEILLANCE AUTH
  onAuthStateChanged(auth, (user) => {
    document.getElementById('loading-screen').style.display = 'none';
    if (user) {
        window.showPage('feed');
    } else {
        window.showPage('login');
    }
  });

</script>
</body>
</html>
