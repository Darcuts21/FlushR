<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlushR — Trouvez votre trône</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* [Tes styles restent inchangés ici...] */
  :root {
    --bg: #F5F0EA;
    --surface: #FFFFFF;
    --accent: #1B6B45;
    --accent-light: #D4EDE1;
    --accent2: #F5A623;
    --text: #111111;
    --text-muted: #7A7A7A;
    --border: rgba(0,0,0,0.08);
    --radius: 20px;
    --radius-sm: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.07);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
    --font-display: 'Syne', sans-serif;
    --font-body: 'Outfit', sans-serif;
    --nav-h: 62px;
    --bottom-h: 72px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; font-size: 15px; }
  .hidden { display: none !important; }
  .topnav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 18px;
    justify-content: space-between; z-index: 200;
    backdrop-filter: blur(12px); background: rgba(255,255,255,0.92);
  }
  .topnav-logo { font-family: var(--font-display); font-size: 24px; color: var(--accent); letter-spacing: -0.5px; }
  .topnav-logo span { color: var(--accent2); }
  .topnav-right { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--accent-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: var(--accent); cursor: pointer; border: 2px solid var(--accent-light);
  }
  .notif-btn {
    width: 34px; height: 34px; border-radius: 50%; background: var(--bg);
    display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
    font-size: 16px;
  }
  .notif-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #E84040; border-radius: 50%; border: 1px solid white; display: none; }
  .notif-dot.active { display: block; }
  /* [... reste des styles condensés pour la visibilité] */
</style>
</head>
<body>

<nav id="topnav" class="topnav">
  <div class="topnav-logo">Flush<span>R</span></div>
  <div class="topnav-right">
    <div class="notif-btn" id="notif-btn" onclick="checkNotifications()">🔔<span class="notif-dot" id="notif-dot"></span></div>
    <div class="avatar" id="avatar-btn">A</div>
  </div>
</nav>

<!-- Scripts avec intégration Admin et Notifications -->
<script>
  // 1. Structure des utilisateurs avec compte Admin
  const users = {
    "admin1": {
      "name": "Admin",
      "role": "Administrator",
      "access_level": 5,
      "notifications": []
    }
  };

  // 2. Activation et Logique du système de notification
  let notificationsActive = true;

  function sendNotification(userId, message) {
    if (!notificationsActive) return;
    
    if (users[userId]) {
      users[userId].notifications.push({
        id: Date.now(),
        text: message,
        read: false
      });
      updateNotifUI();
      console.log(`[NOTIFICATION] Pour ${users[userId].name}: ${message}`);
      showToast("Nouvelle notification !");
    }
  }

  function updateNotifUI() {
    const dot = document.getElementById('notif-dot');
    const hasUnread = users["admin1"].notifications.some(n => !n.read);
    if (hasUnread) {
      dot.classList.add('active');
    } else {
      dot.classList.remove('active');
    }
  }

  function checkNotifications() {
    if (users["admin1"].notifications.length > 0) {
      const lastNotif = users["admin1"].notifications[users["admin1"].notifications.length - 1];
      alert("Notification Admin: " + lastNotif.text);
      lastNotif.read = true;
      updateNotifUI();
    } else {
      showToast("Aucune nouvelle notification");
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Initialisation au chargement
  window.onload = () => {
    updateNotifUI();
    // Exemple d'activation automatique
    setTimeout(() => {
        sendNotification("admin1", "Bienvenue sur le dashboard FlushR.");
    }, 2000);
  };
</script>

<div id="toast" class="toast"></div>

</body>
</html>
