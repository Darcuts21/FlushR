<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlushR — Profil & Filtres</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#F7F4EF; --surface:#fff; --accent:#2D6A4F; --text:#1A1A1A; --text2:#5C5C5C; --border:rgba(0,0,0,0.08); --radius:20px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
body{font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden}
.hidden { display: none !important; }

/* UI ELEMENTS */
nav{background:var(--surface); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100}
.page{max-width:1000px; margin:0 auto; padding:16px 100px 16px 16px;}
.cards-grid{display:grid; gap:16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.btn-primary{background:var(--accent); color:white; border:none; padding:14px; border-radius:12px; font-weight:700; width:100%; cursor:pointer}

/* CARDS */
.toilet-card{background:white; border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; padding:15px}
.amenity-tag { font-size: 11px; background: var(--bg); padding: 4px 8px; border-radius: 6px; margin-right:4px; display:inline-block}

/* PROFILE SETUP & SETTINGS */
.setup-card { background: white; padding: 24px; border-radius: 24px; max-width: 400px; margin: 40px auto; text-align: center; border: 1px solid var(--border); }
.pref-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg); border-radius: 12px; margin-bottom: 8px; }

/* NAVIGATION BASSE */
.mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 15px 0; z-index: 150; }
</style>
</head>
<body>

<nav id="main-nav" class="hidden">
  <div style="font-family:Syne; font-weight:800; color:var(--accent)">FlushR</div>
  <div id="user-display" style="font-size:12px; color:var(--text2)"></div>
</nav>

<!-- CONNEXION -->
<div id="page-login" class="page hidden" style="text-align:center; padding-top:100px">
  <h1 style="font-family:Syne; font-size:40px">FlushR</h1>
  <button onclick="window.doGoogleLogin()" class="btn-primary" style="max-width:250px; margin-top:20px">Se connecter avec Google</button>
</div>

<!-- CONFIGURATION INITIALE DU PROFIL -->
<div id="page-setup" class="page hidden">
    <div class="setup-card">
        <h2 style="font-family:Syne">Bienvenue !</h2>
        <p style="font-size:14px; color:gray; margin-bottom:20px">Configure tes préférences pour un filtrage automatique.</p>
        <div id="setup-options">
            <label class="pref-item"><span>🆓 Uniquement Gratuit</span> <input type="checkbox" id="pref-free"></label>
            <label class="pref-item"><span>♿ Accès PMR requis</span> <input type="checkbox" id="pref-pmr"></label>
            <label class="pref-item"><span>✨ Toujours Nickel</span> <input type="checkbox" id="pref-clean"></label>
        </div>
        <button class="btn-primary" onclick="window.saveProfile()">Terminer la configuration</button>
    </div>
</div>

<!-- FIL D'ACTUALITÉ -->
<div id="page-feed" class="hidden">
  <div class="page">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
        <h2 style="font-family:Syne">Pour vous</h2>
        <span style="font-size:11px; color:var(--accent); font-weight:bold" onclick="showPage('setup')">⚙️ Mes réglages</span>
    </div>
    <div id="filter-info" style="font-size:12px; color:gray; margin-bottom:15px"></div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>
</div>

<!-- MODAL AJOUT -->
<div class="modal-bg hidden" id="modal-add" style="position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; display:flex; align-items:center; justify-content:center" onclick="if(event.target==this) this.classList.add('hidden')">
  <div style="background:white; padding:24px; border-radius:24px; width:90%; max-width:450px">
    <h3 style="margin-bottom:15px">Ajouter un lieu</h3>
    <input type="text" id="add-name" placeholder="Nom" style="width:100%; padding:10px; margin-bottom:10px">
    <input type="text" id="add-address" placeholder="Adresse" style="width:100%; padding:10px; margin-bottom:10px">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px">
        <select id="add-price"><option>Gratuit</option><option>Payant</option></select>
        <select id="add-clean"><option>✨ Nickel</option><option>OK</option><option>⚠️ Sale</option></select>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; font-size:12px">
        <label><input type="checkbox" id="check-pmr"> ♿ PMR</label>
        <label><input type="checkbox" id="check-paper"> 🧻 Papier</label>
    </div>
    <button class="btn-primary" onclick="window.submitToilet()" style="margin-top:15px">Publier</button>
  </div>
</div>

<div class="mobile-nav hidden" id="mobile-menu">
    <div onclick="renderFeed()">🏠</div>
    <div onclick="document.getElementById('modal-add').classList.remove('hidden')" style="background:var(--accent); color:white; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center">+</div>
    <div onclick="window.doLogout()">🚪</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, getDoc, setDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2Z_crCC6Hfn3haaPqd8UErXxzTcEXKZY",
    authDomain: "flushr-ca973.firebaseapp.com",
    projectId: "flushr-ca973",
    storageBucket: "flushr-ca973.firebasestorage.app",
    messagingSenderId: "637232955486",
    appId: "1:637232955486:web:9eba4e51f1e2d6d89874cf"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let userPrefs = null;

  window.doGoogleLogin = async () => { try { await signInWithPopup(auth, provider); } catch(e){alert(e.message)} };
  window.doLogout = () => signOut(auth);

  // SAUVEGARDE DU PROFIL
  window.saveProfile = async () => {
    const prefs = {
        onlyFree: document.getElementById('pref-free').checked,
        onlyPMR: document.getElementById('pref-pmr').checked,
        onlyClean: document.getElementById('pref-clean').checked,
        setupDone: true
    };
    await setDoc(doc(db, "users", auth.currentUser.uid), prefs);
    userPrefs = prefs;
    showPage('feed');
  };

  window.submitToilet = async () => {
    const data = {
        name: document.getElementById('add-name').value,
        address: document.getElementById('add-address').value,
        price: document.getElementById('add-price').value,
        clean: document.getElementById('add-clean').value,
        hasPMR: document.getElementById('check-pmr').checked,
        createdBy: auth.currentUser.displayName,
        createdAt: new Date()
    };
    await addDoc(collection(db, "toilets"), data);
    document.getElementById('modal-add').classList.add('hidden');
    renderFeed();
  };

  async function renderFeed() {
    const grid = document.getElementById('cards-grid');
    grid.innerHTML = "Chargement...";
    const snap = await getDocs(query(collection(db, "toilets"), orderBy("createdAt", "desc")));
    grid.innerHTML = "";
    
    let count = 0;
    snap.forEach(doc => {
        const t = doc.data();
        
        // LOGIQUE DE FILTRAGE AUTOMATIQUE SELON LE PROFIL
        if (userPrefs.onlyFree && t.price !== 'Gratuit') return;
        if (userPrefs.onlyPMR && !t.hasPMR) return;
        if (userPrefs.onlyClean && t.clean !== '✨ Nickel') return;

        count++;
        const card = document.createElement('div');
        card.className = 'toilet-card';
        card.innerHTML = `
            <span class="amenity-tag">${t.price}</span>
            <h3 style="margin:8px 0">${t.name}</h3>
            <p style="font-size:12px; color:gray">📍 ${t.address}</p>
            <div style="margin-top:10px">
                ${t.hasPMR ? '<span class="amenity-tag">♿ PMR</span>' : ''}
                <span class="amenity-tag">${t.clean}</span>
            </div>
        `;
        grid.appendChild(card);
    });

    document.getElementById('filter-info').innerText = `${count} lieux correspondent à vos préférences.`;
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById('user-display').innerText = user.displayName;
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists() && userDoc.data().setupDone) {
            userPrefs = userDoc.data();
            showPage('feed');
        } else {
            showPage('setup');
        }
    } else {
        showPage('login');
    }
  });

  function showPage(p) {
    ['login', 'setup', 'feed'].forEach(id => document.getElementById('page-'+id).classList.add('hidden'));
    document.getElementById('main-nav').classList.toggle('hidden', p === 'login');
    document.getElementById('mobile-menu').classList.toggle('hidden', p !== 'feed');
    document.getElementById('page-'+p).classList.remove('hidden');
    if(p === 'feed') renderFeed();
  }
</script>
</body>
</html>
